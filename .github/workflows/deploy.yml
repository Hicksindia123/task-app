name: Deploy TaskFlow to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set permissions for GitHub Pages and branch deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment to prevent race conditions
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Test Suite
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /task-app/

      - name: Configure SPA 404 Fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      # 1. Official GitHub Pages Deployment (Actions workflow source)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2. Deploy to gh-pages branch (Fail-safe for branch-based Pages hosting)
      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: frontend/dist
          clean: true
